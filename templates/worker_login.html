{% extends "worker_base.html" %}

{% block title %}Worker Login — Nagrik-Seva{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-4">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5">
    
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
      <!-- Card Header -->
      <div class="p-4 text-center text-white" style="background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);">
        <div class="d-inline-flex align-items-center justify-content-center bg-warning text-dark rounded-circle mb-3" style="width: 60px; height: 60px; font-size: 1.75rem;">
          <i class="fas fa-hard-hat"></i>
        </div>
        <h3 class="fw-bold mb-1">Worker Login</h3>
        <p class="text-white-50 small mb-0">Nagrik-Seva Field Issue Management System</p>
      </div>

      <!-- Card Body -->
      <div class="card-body p-4 bg-white">
        {% if error %}
          <div class="alert alert-danger d-flex align-items-center mb-4 rounded-3" role="alert">
            <i class="fas fa-exclamation-circle me-2 fs-5"></i>
            <div>{{ error }}</div>
          </div>
        {% endif %}

        <form action="{{ url_for('worker_login') }}" method="POST">
          <div class="mb-3">
            <label for="worker_id" class="form-label fw-bold text-dark fs-7">
              <i class="fas fa-id-badge me-1 text-primary"></i> Worker ID / Username
            </label>
            <input type="text" class="form-control form-control-lg fs-6 rounded-3" id="worker_id" name="worker_id" placeholder="e.g. WRK-1024" required autofocus>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-bold text-dark fs-7">
              <i class="fas fa-lock me-1 text-primary"></i> Password
            </label>
            <input type="password" class="form-control form-control-lg fs-6 rounded-3" id="password" name="password" placeholder="Enter password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-3 shadow-sm" style="background-color: #1e3a8a; border-color: #1e3a8a;">
            <i class="fas fa-sign-in-alt me-2"></i> Log In to Worker Panel
          </button>
        </form>

        <!-- Quick Demo Worker Account Picker -->
        <div class="mt-4 pt-3 border-top text-center">
          <p class="text-muted small fw-semibold mb-2"><i class="fas fa-user-check me-1"></i> Quick Test Accounts (Click to Fill):</p>
          <div class="d-flex flex-wrap justify-content-center gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="quickFill('WRK-1024', 'password123')">
              👷 Rahul Sharma <small class="text-primary">(WRK-1024)</small>
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="quickFill('WRK-1001', 'password123')">
              🧹 Suresh Kumar <small class="text-primary">(WRK-1001)</small>
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="quickFill('WRK-1005', 'password123')">
              💧 Anita Patel <small class="text-primary">(WRK-1005)</small>
            </button>
          </div>
        </div>
      </div>

      <!-- Card Footer -->
      <div class="card-footer bg-light p-3 text-center border-0">
        <a href="/" class="text-decoration-none small text-secondary fw-semibold">
          <i class="fas fa-arrow-left me-1"></i> Back to Citizen Reporting Portal
        </a>
      </div>
    </div>

  </div>
</div>

<script>
function quickFill(workerId, pwd) {
  document.getElementById('worker_id').value = workerId;
  document.getElementById('password').value = pwd;
}
</script>
{% endblock %}
